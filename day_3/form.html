<h1>JOB APPLICATION: senior web developer</h1>

<p>Thank you for your interest in the senior web developer position. Please fill out the form below to submit your application.</p>
<hr>

<form>
    <h1>personal Information</h1>
    <label for="full name">Full Name:</label>
    <input type="text" id="full name" name="full name">
    <br><br>

    <label for="Email">Email:</label>
    <input type="email" id="Email" name="Email">
    <br><br>

    <label for="phone number">Phone Number:</label>
    <input type="tel" id="phone number" name="phone number">
    <br><br>

    <label for="LinkedIn profile URL">LinkedIn profile URL:</label>
    <input type="url" id="LinkedIn profile URL" name="LinkedIn profile URL" placeholder="https://www.linkedin.com/in/">
    <br><br>

    <hr>

    <h1>Professional Experience</h1>

    <label for="Upload your Resume">Upload Your Resume:</label>
    <br><br>
    <input type ="file" id="file" name="file">
    <br><br>

    <label for="cover letter">Cover letter:</label>
    <textarea id="cover letter" name="cover letter" rows="10" cols="20" placeholder="Please write your cover letter here..."></textarea>
    <br><br>

    <label for="years of professional experience ">years of professional experience:</label>
    <input type="number" id="years of professional experience" name="years of professional experience">
    <br><br>

    
    <label for="Earliest possible start date">Earliest possible start date:</label>
    <input type="date" id="Earliest possible start date" name="Earliest possible start date">
    <br><br>

    <hr>

    <h1>Skills And Availability</h1>

    <label for="primary skillset">Primary Skillset:</label>
    <br><br>

    <input type="radio" id="frontend development" name="primary skillset" value="frontend development">
    <label for="frontend development">Frontend Development</label>
    <br><br>

    <input type="radio" id="backend development" name="primary skillset" value="backend development">
    <label for="backend development">Backend Development</label>
    <br><br>


    <input type="radio" id="fullstack development" name="primary skillset" value="fullstack development">
    <label for="fullstack development">Fullstack Development</label>
    <br><br>

    <label for="Additional Skills">Additional Skills:</label>
    <br><br>

    <label for="React">React</label>
    <input type="checkbox" id="react" name="skills" value="react">
    <br><br>
    
    <label for="Node.js">Node.js</label>
    <input type="checkbox" id="node.js" name="skills" value="node.js">
    <br><br>

    <label for="Database Management">Database Management</label>
    <input type="checkbox" id="database management" name="skills" value="database management">
    <br><br>

    <label for="cloud computing">Cloud Computing</label>
    <input type="checkbox" id="cloud computing" name="skills" value="cloud computing">
    <br><br>

    <label for="preferred worktime">preferred worktime:</label>
    <br><br>
    <select id="preferred worktime" name="preferred worktime">
        <option value="full-time">Full-time</option>
        <option value="part-time">Part-time</option>
        <option value="freelance">Freelance</option>
     </select>
    <br><br>

    <hr>

    <h1>Final confirmation</h1>

    
    <input type="checkbox" id="I am legally authorized to work in the country" name="I am legally authorized to work in the country">
    <label for="I am legally authorized to work in the country">I am legally authorized to work in the country:</label>
    <br><br>

    <label for="how did you hear aboutr us?">How did you hear about us?</label>
    <br><br>
    <input type="text" id="how did you hear aboutr us?" name="how did you hear aboutr us?" placeholder="e.g. LinkedIn, Indeed">
    <br><br>
   

    <hr>
    
    <button type="submit">Submit Application</button>
    <button type="reset">Clear Form</button>

</form>
